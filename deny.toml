# cargo-deny 0.20 policy. The crate depends on nothing, and this keeps it so unless someone decides otherwise.

[graph]
all-features = true

[advisories]

[licenses]
allow = ["Apache-2.0"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
